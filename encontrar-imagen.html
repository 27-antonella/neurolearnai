<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeuroLearn AI - Encontrá la imagen</title>

<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
        linear-gradient(
            135deg,
            #eef5ff,
            #f8fbff
        );

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}


/* =========================================
   CONTENEDOR
========================================= */

.contenedor{

    width:1100px;

    min-height:90vh;

    background:white;

    border-radius:28px;

    overflow:hidden;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.12);

}


/* =========================================
   BARRA SUPERIOR
========================================= */

.barra{

    height:85px;

    background:
        linear-gradient(
            90deg,
            #1769ff,
            #2878ff,
            #1769ff
        );

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 35px;

    color:white;

}

.marca{

    display:flex;

    align-items:center;

    gap:14px;

}

.logo{

    width:52px;

    height:52px;

    border-radius:50%;

    background:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;

}

.marca h1{

    font-size:24px;

}

.volver{

    border:none;

    background:white;

    color:#1769ff;

    padding:12px 22px;

    border-radius:14px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.volver:hover{

    transform:scale(1.05);

}


/* =========================================
   CONTENIDO
========================================= */

.contenido{

    padding:35px;

    text-align:center;

}

.titulo{

    color:#172b4d;

    font-size:34px;

    margin-bottom:8px;

}

.subtitulo{

    color:#64748b;

    font-size:17px;

    margin-bottom:22px;

}


/* =========================================
   INSTRUCCIÓN
========================================= */

.instruccion{

    display:inline-flex;

    align-items:center;

    gap:10px;

    background:#eef5ff;

    color:#1769ff;

    padding:12px 20px;

    border-radius:20px;

    font-weight:bold;

    margin-bottom:25px;

}


/* =========================================
   PREGUNTA
========================================= */

.pregunta{

    max-width:700px;

    margin:0 auto 30px;

    background:#f8fbff;

    border-radius:22px;

    padding:22px;

    box-shadow:
        0 6px 18px
        rgba(0,0,0,.06);

}

.pregunta p{

    color:#64748b;

    font-size:15px;

    margin-bottom:8px;

}

.pregunta h2{

    color:#172b4d;

    font-size:28px;

}


/* =========================================
   OPCIONES
========================================= */

.opciones{

    max-width:760px;

    margin:0 auto;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;

}


/* =========================================
   TARJETA DE IMAGEN
========================================= */

.opcion{

    min-height:180px;

    border:4px solid #e8effa;

    border-radius:25px;

    background:white;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    transition:.2s;

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.07);

}

.opcion:hover{

    transform:translateY(-5px);

    border-color:#9fc3ff;

    box-shadow:
        0 12px 25px
        rgba(23,105,255,.13);

}

.opcion:disabled{

    cursor:default;

}


/* =========================================
   ANIMAL
========================================= */

.animal{

    font-size:80px;

    line-height:1;

    margin-bottom:12px;

}

.nombre{

    color:#172b4d;

    font-size:18px;

    font-weight:bold;

}


/* =========================================
   RESPUESTA CORRECTA
========================================= */

.opcion.correcta{

    border-color:#55c982;

    background:#edfff4;

    animation:
        correcto .4s ease;

}


/* =========================================
   RESPUESTA INCORRECTA
========================================= */

.opcion.incorrecta{

    border-color:#ff8c8c;

    background:#fff1f1;

    animation:
        error .35s ease;

}


/* =========================================
   MENSAJE
========================================= */

.mensaje{

    min-height:32px;

    margin-top:22px;

    font-size:18px;

    font-weight:bold;

    color:#64748b;

}


/* =========================================
   INFORMACIÓN
========================================= */

.informacion{

    display:flex;

    justify-content:center;

    gap:20px;

    margin-top:25px;

    flex-wrap:wrap;

}

.info{

    min-width:160px;

    padding:12px 20px;

    background:#f8fbff;

    border-radius:16px;

    color:#64748b;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.06);

}

.info strong{

    color:#1769ff;

    font-size:18px;

}


/* =========================================
   BOTÓN REINICIAR
========================================= */

.reiniciar{

    margin-top:25px;

    border:none;

    background:#1769ff;

    color:white;

    padding:13px 28px;

    border-radius:14px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.reiniciar:hover{

    background:#0056e8;

    transform:scale(1.03);

}


/* =========================================
   ÉXITO
========================================= */

.exito{

    display:none;

    max-width:650px;

    margin:25px auto 0;

    padding:22px;

    background:#e8f9ed;

    color:#17833b;

    border-radius:20px;

    font-size:20px;

    font-weight:bold;

}

.exito.mostrar{

    display:block;

    animation:
        aparecer .4s ease;

}


/* =========================================
   ANIMACIONES
========================================= */

@keyframes aparecer{

    from{

        opacity:0;

        transform:scale(.9);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}

@keyframes correcto{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }

}

@keyframes error{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-7px);
    }

    50%{
        transform:translateX(7px);
    }

    75%{
        transform:translateX(-5px);
    }

    100%{
        transform:translateX(0);
    }

}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:750px){

    body{

        padding:0;

        align-items:flex-start;

    }

    .contenedor{

        width:100%;

        min-height:100vh;

        border-radius:0;

    }

    .barra{

        padding:0 18px;

        height:75px;

    }

    .marca h1{

        font-size:19px;

    }

    .logo{

        width:45px;

        height:45px;

        font-size:24px;

    }

    .volver{

        padding:10px 14px;

        font-size:14px;

    }

    .contenido{

        padding:25px 15px;

    }

    .titulo{

        font-size:28px;

    }

    .subtitulo{

        font-size:16px;

    }

    .pregunta h2{

        font-size:22px;

    }

    .opciones{

        grid-template-columns:1fr;

        gap:15px;

    }

    .opcion{

        min-height:150px;

    }

}

</style>

</head>

<body>

<div class="contenedor">

<!-- =========================================
     BARRA SUPERIOR
========================================= -->

<header class="barra">

```
<div class="marca">

    <div class="logo">
        🧠
    </div>

    <h1>
        NeuroLearn AI
    </h1>

</div>


<button
    class="volver"
    onclick="volver()">

    ← Volver

</button>
```

</header>

<!-- =========================================
     CONTENIDO
========================================= -->

<main class="contenido">

```
<h1 class="titulo">

    👀 Encontrá la imagen

</h1>


<p class="subtitulo">

    Mirá con atención y elegí la imagen correcta.

</p>


<div class="instruccion">

    💡 Tocá la imagen que responde la pregunta

</div>



<!-- =====================================
     PREGUNTA
====================================== -->

<div class="pregunta">

    <p>
        Buscá:
    </p>

    <h2 id="pregunta">
        ¿Dónde está el gato?
    </h2>

</div>



<!-- =====================================
     OPCIONES
====================================== -->

<div
    id="opciones"
    class="opciones">

</div>



<!-- =====================================
     MENSAJE
====================================== -->

<div
    id="mensaje"
    class="mensaje">

</div>



<!-- =====================================
     INFORMACIÓN
====================================== -->

<div class="informacion">

    <div class="info">

        Aciertos:

        <strong id="aciertos">
            0
        </strong>

    </div>


    <div class="info">

        Pregunta:

        <strong>

            <span id="numeroPregunta">
                1
            </span>
            / 6

        </strong>

    </div>

</div>



<!-- =====================================
     REINICIAR
====================================== -->

<button
    class="reiniciar"
    onclick="iniciarJuego()">

    🔄 Empezar de nuevo

</button>



<!-- =====================================
     FINAL
====================================== -->

<div
    id="exito"
    class="exito">

    🎉 ¡Excelente!

    <br>

    Completaste todas las preguntas.

    ⭐🧠

</div>
```

</main>

</div>

<script>

/* =========================================
   BANCO DE PREGUNTAS
========================================= */

const preguntas = [

    {
        pregunta:"¿Dónde está el gato?",
        respuesta:"Gato",
        opciones:[
            {
                emoji:"🐶",
                nombre:"Perro"
            },
            {
                emoji:"🐱",
                nombre:"Gato"
            },
            {
                emoji:"🐰",
                nombre:"Conejo"
            },
            {
                emoji:"🐟",
                nombre:"Pez"
            }
        ]
    },

    {
        pregunta:"¿Dónde está el perro?",
        respuesta:"Perro",
        opciones:[
            {
                emoji:"🐱",
                nombre:"Gato"
            },
            {
                emoji:"🐟",
                nombre:"Pez"
            },
            {
                emoji:"🐶",
                nombre:"Perro"
            },
            {
                emoji:"🐰",
                nombre:"Conejo"
            }
        ]
    },

    {
        pregunta:"¿Dónde está el pez?",
        respuesta:"Pez",
        opciones:[
            {
                emoji:"🐰",
                nombre:"Conejo"
            },
            {
                emoji:"🐶",
                nombre:"Perro"
            },
            {
                emoji:"🐟",
                nombre:"Pez"
            },
            {
                emoji:"🐱",
                nombre:"Gato"
            }
        ]
    },

    {
        pregunta:"¿Dónde está el conejo?",
        respuesta:"Conejo",
        opciones:[
            {
                emoji:"🐟",
                nombre:"Pez"
            },
            {
                emoji:"🐱",
                nombre:"Gato"
            },
            {
                emoji:"🐶",
                nombre:"Perro"
            },
            {
                emoji:"🐰",
                nombre:"Conejo"
            }
        ]
    },

    {
        pregunta:"¿Dónde está el gato?",
        respuesta:"Gato",
        opciones:[
            {
                emoji:"🐰",
                nombre:"Conejo"
            },
            {
                emoji:"🐱",
                nombre:"Gato"
            },
            {
                emoji:"🐟",
                nombre:"Pez"
            },
            {
                emoji:"🐶",
                nombre:"Perro"
            }
        ]
    },

    {
        pregunta:"¿Dónde está el pez?",
        respuesta:"Pez",
        opciones:[
            {
                emoji:"🐶",
                nombre:"Perro"
            },
            {
                emoji:"🐰",
                nombre:"Conejo"
            },
            {
                emoji:"🐱",
                nombre:"Gato"
            },
            {
                emoji:"🐟",
                nombre:"Pez"
            }
        ]
    }

];


/* =========================================
   VARIABLES
========================================= */

let preguntaActual = 0;

let aciertos = 0;

let respondiendo = false;


/* =========================================
   INICIAR JUEGO
========================================= */

function iniciarJuego(){

    preguntaActual = 0;

    aciertos = 0;

    respondiendo = false;


    document.getElementById(
        "aciertos"
    ).textContent = "0";


    document.getElementById(
        "numeroPregunta"
    ).textContent = "1";


    document.getElementById(
        "mensaje"
    ).textContent = "";


    document.getElementById(
        "exito"
    ).classList.remove("mostrar");


    mostrarPregunta();

}


/* =========================================
   MOSTRAR PREGUNTA
========================================= */

function mostrarPregunta(){

    const datos =
        preguntas[preguntaActual];


    document.getElementById(
        "pregunta"
    ).textContent =
        datos.pregunta;


    document.getElementById(
        "numeroPregunta"
    ).textContent =
        preguntaActual + 1;


    const contenedor =
        document.getElementById("opciones");


    contenedor.innerHTML = "";


    let opciones =
        [...datos.opciones];


    opciones.sort(
        () => Math.random() - 0.5
    );


    opciones.forEach(
        opcion => {

            const boton =
                document.createElement("button");


            boton.className =
                "opcion";


            boton.innerHTML = `

                <div class="animal">
                    ${opcion.emoji}
                </div>

                <div class="nombre">
                    ${opcion.nombre}
                </div>

            `;


            boton.addEventListener(
                "click",
                () => comprobarRespuesta(
                    boton,
                    opcion.nombre
                )
            );


            contenedor.appendChild(boton);

        }
    );


    respondiendo = false;

}


/* =========================================
   COMPROBAR RESPUESTA
========================================= */

function comprobarRespuesta(
    boton,
    respuesta
){

    if(respondiendo){

        return;

    }


    respondiendo = true;


    const correcta =
        preguntas[preguntaActual].respuesta;


    if(respuesta === correcta){

        boton.classList.add(
            "correcta"
        );


        aciertos++;


        document.getElementById(
            "aciertos"
        ).textContent =
            aciertos;


        document.getElementById(
            "mensaje"
        ).textContent =
            "🎉 ¡Muy bien! Encontraste la imagen correcta.";


        document.querySelectorAll(
            ".opcion"
        ).forEach(
            b => b.disabled = true
        );


        setTimeout(
            siguientePregunta,
            1100
        );

    }
    else{

        boton.classList.add(
            "incorrecta"
        );


        document.getElementById(
            "mensaje"
        ).textContent =
            "💡 Casi. Mirá nuevamente y probá otra vez.";

        
        respondiendo = false;


        setTimeout(
            () => {

                boton.classList.remove(
                    "incorrecta"
                );

            },
            700
        );

    }

}


/* =========================================
   SIGUIENTE PREGUNTA
========================================= */

function siguientePregunta(){

    preguntaActual++;


    if(
        preguntaActual >= preguntas.length
    ){

        finalizarJuego();

        return;

    }


    document.getElementById(
        "mensaje"
    ).textContent = "";


    mostrarPregunta();

}


/* =========================================
   FINALIZAR
========================================= */

function finalizarJuego(){

    document.getElementById(
        "opciones"
    ).innerHTML = "";


    document.getElementById(
        "pregunta"
    ).textContent =
        "¡Terminaste el juego!";


    document.getElementById(
        "numeroPregunta"
    ).textContent =
        preguntas.length;


    document.getElementById(
        "mensaje"
    ).textContent =
        "🌟 ¡Excelente trabajo!";


    document.getElementById(
        "exito"
    ).classList.add(
        "mostrar"
    );

}


/* =========================================
   VOLVER
========================================= */

function volver(){

    window.location.href =
        "juegos.html";

}


/* =========================================
   INICIAR
========================================= */

iniciarJuego();

</script>

</body>

</html>
