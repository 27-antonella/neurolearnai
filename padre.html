<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Padre / Profesor</title>

<style>

body{
font-family:Arial,sans-serif;
background:#dff4ff;
padding:40px;
}

.panel{
max-width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.1);
}

h1{
color:#0084ff;
text-align:center;
margin-bottom:20px;
}

.tarjeta{
background:#f5f8ff;
padding:15px;
margin-top:15px;
border-radius:15px;
}

button{
margin-top:20px;
padding:12px 20px;
background:#0084ff;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="panel">

<h1>👨‍🏫 Panel Padre / Profesor</h1>

<div class="tarjeta">
<h3>📚 Progreso del alumno</h3>
<p>Aquí aparecerán los avances del estudiante.</p>
</div>

<div class="tarjeta">
<h3>🧠 Perfil de aprendizaje</h3>
<p>Visual, Interactivo, Lectura, TDAH, etc.</p>
</div>

<div class="tarjeta">
<h3>📈 Estadísticas</h3>
<p>Preguntas realizadas, temas aprendidos y progreso.</p>
</div>

<button onclick="window.location.href='index.html'">
Volver al inicio
</button>

</div>

</body>
</html>
