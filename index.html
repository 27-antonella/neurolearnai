
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroLearn AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(to bottom, #cfefff, #eef9ff);
        }

        .card {
            background: white;
            width: 100%;
            max-width: 360px;
            padding: 30px 28px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 68px;
            margin-bottom: 12px;
        }

        h1 {
            color: #0084ff;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .sub {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .robot {
            font-size: 55px;
            margin-bottom: 18px;
            animation: flotar 3s ease-in-out infinite;
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .boton {
            display: block;
            width: 100%;
            padding: 13px 10px;
            margin-top: 10px;
            border: none;
            border-radius: 13px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .boton:hover {
            transform: translateY(-2px);
        }

        .empezar {
            background: #0084ff;
            color: white;
        }

        .empezar:hover {
            background: #006ad6;
        }

        .registro {
            background: #e8f3ff;
            color: #0077cc;
            border: 1px solid #b9ddff;
        }

        .registro:hover {
            background: #d7eaff;
        }

        .login {
            background: #7c55d9;
            color: white;
        }

        .login:hover {
            background: #6440bd;
        }

        .profesor {
            background: #4caf50;
            color: white;
        }

        .profesor:hover {
            background: #388e3c;
        }

        @media (max-width: 400px) {
            .card {
                padding: 25px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="card">

        <div class="logo">🤖</div>

        <h1>NeuroLearn AI</h1>

        <p class="sub">Tu amigo para aprender</p>

        <div class="robot">🧠🤖</div>

        <a class="boton empezar" href="aprendizaje.html">
            Empezar
        </a>

        <a class="boton login" href="login.html">
            Iniciar sesión
        </a>

        <a class="boton registro" href="perfiles.html">
            Registrarte
        </a>

        <a class="boton profesor" href="padre.html">
            Soy padre/profesor
        </a>

    </main>
</body>
</html>
