<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroLearn AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom,#cfefff,#eef9ff);
}

.card{
background:white;
width:450px;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
font-size:90px;
margin-bottom:15px;
}

h1{
color:#0084ff;
margin-bottom:10px;
}

.sub{
color:#666;
margin-bottom:25px;
}

.robot{
font-size:70px;
margin-bottom:20px;
animation:flotar 3s infinite;
}

@keyframes flotar{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.empezar{
background:#0084ff;
color:white;
}

.empezar:hover{
background:#006ad6;
}

.profesor{
background:#4CAF50;
color:white;
}

.profesor:hover{
background:#388E3C;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">🤖</div>

<h1>NeuroLearn AI</h1>

<p class="sub">Tu amigo para aprender</p>

<div class="robot">🧠🤖</div>

<button
class="empezar"
onclick="window.location.href='perfiles.html'">
Empezar
</button>

<button
class="profesor"
onclick="window.location.href='padre.html'">
Soy padre/profesor
</button>

</div>

</body>
</html>
