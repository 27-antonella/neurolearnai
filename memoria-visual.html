<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeuroLearn AI - Memoria Visual</title>

<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
        linear-gradient(
            135deg,
            #eef5ff,
            #f8fbff
        );

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}


/* =========================================
   CONTENEDOR
========================================= */

.contenedor{

    width:1100px;

    min-height:90vh;

    background:white;

    border-radius:28px;

    overflow:hidden;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.12);

}


/* =========================================
   BARRA SUPERIOR
========================================= */

.barra{

    height:85px;

    background:
        linear-gradient(
            90deg,
            #1769ff,
            #2878ff,
            #1769ff
        );

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 35px;

    color:white;

}

.marca{

    display:flex;

    align-items:center;

    gap:14px;

}

.logo{

    width:52px;

    height:52px;

    border-radius:50%;

    background:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;

}

.marca h1{

    font-size:24px;

}

.volver{

    border:none;

    background:white;

    color:#1769ff;

    padding:12px 22px;

    border-radius:14px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.volver:hover{

    transform:scale(1.05);

}


/* =========================================
   CONTENIDO
========================================= */

.contenido{

    padding:35px;

    text-align:center;

}

.titulo{

    color:#172b4d;

    font-size:34px;

    margin-bottom:8px;

}

.subtitulo{

    color:#64748b;

    font-size:17px;

    margin-bottom:22px;

}


/* =========================================
   INSTRUCCIÓN
========================================= */

.instruccion{

    display:inline-flex;

    align-items:center;

    gap:10px;

    background:#eef5ff;

    color:#1769ff;

    padding:12px 20px;

    border-radius:20px;

    font-weight:bold;

    margin-bottom:25px;

}


/* =========================================
   INFORMACIÓN
========================================= */

.informacion{

    display:flex;

    justify-content:center;

    gap:20px;

    margin-bottom:25px;

    flex-wrap:wrap;

}

.info{

    min-width:170px;

    padding:12px 20px;

    background:#f8fbff;

    border-radius:16px;

    color:#64748b;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.06);

}

.info strong{

    color:#1769ff;

    font-size:18px;

}


/* =========================================
   TABLERO
========================================= */

.tablero{

    width:620px;

    max-width:100%;

    margin:0 auto;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:18px;

}


/* =========================================
   TARJETAS
========================================= */

.tarjeta{

    height:135px;

    border:none;

    border-radius:22px;

    cursor:pointer;

    perspective:1000px;

    background:transparent;

}


/* =========================================
   INTERIOR TARJETA
========================================= */

.tarjeta-interior{

    width:100%;

    height:100%;

    position:relative;

    transition:
        transform .5s;

    transform-style:preserve-3d;

}

.tarjeta.volteada
.tarjeta-interior{

    transform:
        rotateY(180deg);

}

.tarjeta.encontrada
.tarjeta-interior{

    transform:
        rotateY(180deg);

}


/* =========================================
   CARAS
========================================= */

.frente,
.atras{

    position:absolute;

    width:100%;

    height:100%;

    border-radius:22px;

    backface-visibility:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =========================================
   PARTE OCULTA
========================================= */

.frente{

    background:
        linear-gradient(
            135deg,
            #1769ff,
            #4c91ff
        );

    box-shadow:
        0 7px 18px
        rgba(23,105,255,.20);

    color:white;

    font-size:40px;

}


/* =========================================
   PARTE CON ANIMAL
========================================= */

.atras{

    background:white;

    border:4px solid #e6efff;

    transform:
        rotateY(180deg);

    flex-direction:column;

    box-shadow:
        0 7px 18px
        rgba(0,0,0,.08);

}

.animal{

    font-size:52px;

    line-height:1;

}

.nombre-animal{

    margin-top:8px;

    color:#172b4d;

    font-size:14px;

    font-weight:bold;

}


/* =========================================
   EFECTO HOVER
========================================= */

.tarjeta:not(.volteada):not(.encontrada):hover
.tarjeta-interior{

    transform:
        scale(1.04);

}


/* =========================================
   TARJETA ENCONTRADA
========================================= */

.tarjeta.encontrada
.atras{

    border-color:#72d69a;

    background:#effcf4;

}


/* =========================================
   BOTÓN REINICIAR
========================================= */

.reiniciar{

    margin-top:30px;

    border:none;

    background:#1769ff;

    color:white;

    padding:13px 28px;

    border-radius:14px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.reiniciar:hover{

    background:#0056e8;

    transform:scale(1.03);

}


/* =========================================
   MENSAJE FINAL
========================================= */

.exito{

    display:none;

    margin:25px auto 0;

    max-width:600px;

    padding:20px;

    background:#e8f9ed;

    color:#17833b;

    border-radius:18px;

    font-size:19px;

    font-weight:bold;

}

.exito.mostrar{

    display:block;

    animation:
        aparecer .4s ease;

}


/* =========================================
   ANIMACIÓN
========================================= */

@keyframes aparecer{

    from{

        opacity:0;

        transform:scale(.9);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:750px){

    body{

        padding:0;

        align-items:flex-start;

    }

    .contenedor{

        width:100%;

        min-height:100vh;

        border-radius:0;

    }

    .barra{

        padding:0 18px;

        height:75px;

    }

    .marca h1{

        font-size:19px;

    }

    .logo{

        width:45px;

        height:45px;

        font-size:24px;

    }

    .volver{

        padding:10px 14px;

        font-size:14px;

    }

    .contenido{

        padding:25px 15px;

    }

    .titulo{

        font-size:28px;

    }

    .subtitulo{

        font-size:16px;

    }

    .tablero{

        grid-template-columns:
            repeat(2,1fr);

        gap:15px;

    }

    .tarjeta{

        height:140px;

    }

}

</style>

</head>

<body>

<div class="contenedor">

<!-- =========================================
     BARRA SUPERIOR
========================================= -->

<header class="barra">

```
<div class="marca">

    <div class="logo">
        🧠
    </div>

    <h1>
        NeuroLearn AI
    </h1>

</div>


<button
    class="volver"
    onclick="volver()">

    ← Volver

</button>
```

</header>

<!-- =========================================
     CONTENIDO
========================================= -->

<main class="contenido">

```
<h1 class="titulo">

    🧠 Memoria visual

</h1>


<p class="subtitulo">

    Encontrá las parejas de animales.

</p>


<div class="instruccion">

    💡 Tocá dos tarjetas y buscá la pareja

</div>



<!-- =====================================
     INFORMACIÓN
====================================== -->

<div class="informacion">

    <div class="info">

        Parejas:

        <strong id="parejas">
            0 / 4
        </strong>

    </div>


    <div class="info">

        Movimientos:

        <strong id="movimientos">
            0
        </strong>

    </div>

</div>



<!-- =====================================
     TABLERO
====================================== -->

<div
    id="tablero"
    class="tablero">

</div>



<!-- =====================================
     BOTÓN
====================================== -->

<button
    class="reiniciar"
    onclick="iniciarJuego()">

    🔄 Empezar de nuevo

</button>



<!-- =====================================
     MENSAJE FINAL
====================================== -->

<div
    id="exito"
    class="exito">

    🎉 ¡Excelente!

    <br>

    Encontraste todas las parejas.

    🧠⭐

</div>
```

</main>

</div>

<script>

/* =========================================
   ANIMALES DEL JUEGO
========================================= */

const animales = [

    {
        emoji:"🐶",
        nombre:"Perro"
    },

    {
        emoji:"🐱",
        nombre:"Gato"
    },

    {
        emoji:"🐰",
        nombre:"Conejo"
    },

    {
        emoji:"🐟",
        nombre:"Pez"
    }

];


/* =========================================
   VARIABLES
========================================= */

let primeraTarjeta = null;

let segundaTarjeta = null;

let bloqueo = false;

let parejasEncontradas = 0;

let movimientos = 0;


/* =========================================
   INICIAR JUEGO
========================================= */

function iniciarJuego(){

    primeraTarjeta = null;

    segundaTarjeta = null;

    bloqueo = false;

    parejasEncontradas = 0;

    movimientos = 0;


    document.getElementById(
        "parejas"
    ).textContent = "0 / 4";


    document.getElementById(
        "movimientos"
    ).textContent = "0";


    document.getElementById(
        "exito"
    ).classList.remove("mostrar");


    crearTablero();

}


/* =========================================
   CREAR TABLERO
========================================= */

function crearTablero(){

    const tablero =
        document.getElementById("tablero");


    tablero.innerHTML = "";


    let cartas = [

        ...animales,

        ...animales

    ];


    cartas.sort(
        () => Math.random() - 0.5
    );


    cartas.forEach(
        (animal, indice) => {

            const tarjeta =
                document.createElement("button");


            tarjeta.className =
                "tarjeta";


            tarjeta.dataset.animal =
                animal.nombre;


            tarjeta.innerHTML = `

                <div class="tarjeta-interior">

                    <div class="frente">
                        🧩
                    </div>

                    <div class="atras">

                        <div class="animal">
                            ${animal.emoji}
                        </div>

                        <div class="nombre-animal">
                            ${animal.nombre}
                        </div>

                    </div>

                </div>

            `;


            tarjeta.addEventListener(
                "click",
                () => voltearTarjeta(tarjeta)
            );


            tablero.appendChild(tarjeta);

        }
    );

}


/* =========================================
   VOLTEAR TARJETA
========================================= */

function voltearTarjeta(tarjeta){

    if(bloqueo){

        return;

    }


    if(
        tarjeta === primeraTarjeta
    ){

        return;

    }


    if(
        tarjeta.classList.contains("encontrada")
    ){

        return;

    }


    tarjeta.classList.add(
        "volteada"
    );


    if(!primeraTarjeta){

        primeraTarjeta = tarjeta;

        return;

    }


    segundaTarjeta = tarjeta;

    movimientos++;


    document.getElementById(
        "movimientos"
    ).textContent =
        movimientos;


    comprobarPareja();

}


/* =========================================
   COMPROBAR PAREJA
========================================= */

function comprobarPareja(){

    const sonIguales =
        primeraTarjeta.dataset.animal ===
        segundaTarjeta.dataset.animal;


    if(sonIguales){

        primeraTarjeta.classList.add(
            "encontrada"
        );

        segundaTarjeta.classList.add(
            "encontrada"
        );


        parejasEncontradas++;


        document.getElementById(
            "parejas"
        ).textContent =
            parejasEncontradas + " / 4";


        limpiarSeleccion();


        if(
            parejasEncontradas === 4
        ){

            setTimeout(
                mostrarExito,
                400
            );

        }

    }
    else{

        bloqueo = true;


        setTimeout(
            () => {

                primeraTarjeta.classList.remove(
                    "volteada"
                );

                segundaTarjeta.classList.remove(
                    "volteada"
                );


                limpiarSeleccion();

            },
            900
        );

    }

}


/* =========================================
   LIMPIAR SELECCIÓN
========================================= */

function limpiarSeleccion(){

    primeraTarjeta = null;

    segundaTarjeta = null;

    bloqueo = false;

}


/* =========================================
   MENSAJE FINAL
========================================= */

function mostrarExito(){

    document.getElementById(
        "exito"
    ).classList.add(
        "mostrar"
    );

}


/* =========================================
   VOLVER
========================================= */

function volver(){

    window.location.href =
        "juegos.html";

}


/* =========================================
   INICIAR AL CARGAR
========================================= */

iniciarJuego();

</script>

</body>

</html>
